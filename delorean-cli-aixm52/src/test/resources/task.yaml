name: "Delorean CLI Task Example"
version: "1.0"
verbose: true
logging: "DEBUG"

containers:
  - container: "container-A"
    database:
      url: "jdbc:postgresql://localhost:5433/test"
      username: "postgres"
      password: "postgres"
      hbm2ddl: "create"

pipeline:
  - action: "set_context"
    description: "Context for AIXM 5.2 processing"

  - action: "unmarshal"
    target: "container-A"
    path: "delorean-cli-aixm52/src/test/resources/donlon-aixm-52.xml"
    description : "a5016052"

  - action: "setStatus"
    target: "container-A"
    status: "APPROVED"

  - action: "sax_inspection"
    target: "container-A"

  - action: "temporality_inspection"
    target: "container-A"

  - action: "startup"
    target: "container-A"
    domain-check : false

  - action: "persist"
    target: "container-A"

  - action: "inspect_persisted_message"
    target: "container-A"

  - action: "extract"
    target: "container-A"
    field: "deloreanDescription"
    value: "a5016052"

  - action: "marshal"
    target: "container-A"
    path: "C:/Users/rapha/Downloads/extract.xml"

  - action: "diff"
    target: "container-A"
    path: "C:/Users/rapha/Downloads/diff.xml"

  - action: "predicate"
    target: "container-A"
    time : "2017-07-01T00:00:00Z"
    field: "deloreanDescription"
    value: "a5016052"

  - action: "marshal"
    target: "container-A"
    path: "C:/Users/rapha/Downloads/predicate.xml"

  - action: "shutdown"
    target: "container-A"

  - action: "summary_inspection"
    target: "container-A"
