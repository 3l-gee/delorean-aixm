name: "Delorean CLI Task Example"
version: "1.0"
# logging: DEBUG

containers:
  - container: "container-A"
    database:
      url: "jdbc:postgresql://localhost:5433/aixm-test-51"
      username: "postgres"
      password: "postgres"
      hbm2ddl: "create"

pipeline:
  - action: "unmarshal"
    target: "container-A"
    path: "delorean-cli-aixm51/src/test/resources/donlon-aixm-51.xml"
    description : "489bc9f0"

  - action: "set_status"
    target: "container-A"
    status: "APPROVED"

  - action: "sax_inspection"
    target: "container-A"

  - action: "temporality_inspection"
    target: "container-A"

  - action: "startup"
    target: "container-A"
    domain-check : false

  - action: "persist"
    target: "container-A"

  - action: "render"
    target: "container-A"

  - action: "inspect_persisted_message"
    target: "container-A"

  - action: "extract"
    target: "container-A"
    field: "deloreanDescription"
    field: "deloreanDescription"
    value: "489bc9f0"

  - action: "marshal"
    target: "container-A"
    path: "C:/Users/rapha/Downloads/aixm51/extract.xml"

  - action: "diff"
    target: "container-A"
    path: "C:/Users/rapha/Downloads/aixm51/extract.xml"

  - action: "predicate"
    target: "container-A"
    time : "2017-07-01T00:00:00Z"
    field: "deloreanDescription"
    value: "489bc9f0"

  - action: "marshal"
    target: "container-A"
    path: "C:/Users/rapha/Downloads/aixm51/predicate.xml"

  - action: "shutdown"
    target: "container-A"

  - action: "summary_inspection"
    target: "container-A"
