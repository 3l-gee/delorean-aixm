table:
  method: |
    @Table\(name = \"([A-Z|a-z|0-9|_]+)\", schema = \"([A-Z|a-z|0-9|_]+)\"\)
  ignore: []

class:
  method: |
   public\s+(?:(?:abstract|static|final|strictfp)\s+)*?(?:class|enum)\s+([A-Za-z0-9_]+)
  ignore: []

extends:
  method: |
    extends\s+([A-Za-z0-9_]+)
  ignore: []

column:
  method: |
    @Column\(name = \"([A-Z|a-z|0-9|_]+)\".*\)
  ignore: []

embedded_three:
  method: |
    @AttributeOverrides\({\n*.*@AttributeOverride\(name = \"[A-Z|a-z|0-9|_]+", column = @Column\(name = \"([A-Z|a-z|0-9|_]+)\".*\n.*@AttributeOverride\(name = \"[A-Z|a-z|0-9|_]+", column = @Column\(name = \"([A-Z|a-z|0-9|_]+)\".*\n.*@AttributeOverride\(name = \"[A-Z|a-z|0-9|_]+", column = @Column\(name = \"([A-Z|a-z|0-9|_]+)\".*\)}
  ignore: []

embedded_two:
  method: |
    @AttributeOverrides\({\n.*@AttributeOverride\(name = \"[A-Z|a-z|0-9|_]+", column = @Column\(name = \"([A-Z|a-z|0-9|_]+)\".*\n.*@AttributeOverride\(name = \"[A-Z|a-z|0-9|_]+", column = @Column\(name = \"([A-Z|a-z|0-9|_]+)\".*\)}
  ignore: []

one_to_one:
  method: |
    @JoinColumn\(name = \"([A-Z|a-z|0-9|_]+)\", referencedColumnName = \"([A-Z|a-z|0-9|_]+).*\n.*protected ([A-Z|a-z|0-9|_]+) ([A-Z|a-z|0-9|_]+)
  ignore: []

one_to_many:
  method: |
    @JoinTable\(name = \"([A-Z|a-z|0-9|_]+)\".*\n.*\(name = \"([A-Z|a-z|0-9|_]+).*\n.*\n.*\(name = \"([A-Z|a-z|0-9|_]+)\".*\n.*\n.*protected List<([A-Z|a-z|0-9|_]+)> ([A-Z|a-z|0-9|_]+)
  ignore: []